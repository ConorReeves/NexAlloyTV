name: Bug report
description: File a bug/issue
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Before creating a new bug report, please keep the following in mind:

        - **Do not submit a duplicate bug report**: Search for existing bug reports [here](https://github.com/ConorReeves/NexAlloyTV/issues?q=%5BBug%5D).
        - **This is NexAlloy TV**: Only report bugs here if you're using this fork. Report upstream NexAlloy bugs [on its tracker](https://github.com/NexAlloy/NexAlloy/issues).
  - type: checkboxes
    attributes:
      label: Acknowledgements
      options:
        - label: I have checked all open and closed bug reports and this is not a duplicate.
          required: true
  - type: input
    attributes:
      label: Environment
      description: |
        TV model, Android TV / Google TV version, Root manager (Magisk/KSU/APatch), LSPosed version.  
        Example: Chromecast with Google TV (4K), Android TV 14, Magisk 29.0, JingMatrix/LSPosed-v1.10.2-7182.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Bug description
      description: |
        - Describe your bug in detail
        - Add steps to reproduce the bug if possible (Step 1. ... Step 2. ...)
        - Add images and videos if possible
        - Include the version of the target application
    validations:
      required: true
  - type: textarea
    attributes:
      label: Error logs
      description: |
        - If you are reporting a YouTube TV bug and can connect over adb, a DevTools console log helps too (see "Inspecting the TV app" in tv-script/README.md).
        - Reproduce the bug
        - Open LSPosed Manager -> Logs
        - Save logs
        - Upload the saved zip file
    validations:
      required: true
  - type: checkboxes
    attributes:
      label: Re-acknowledgement
      options:
        - label: I have chosen an appropriate title.
          required: true
        - label: I understand that issues without necessary information will be closed without notice.
          required: true