      **PLEASE READ BEFORE SUBMITTING**
      NexAlloy TV brings Morphe ([morphe.software](https://morphe.software/)) features to YouTube on Google TV and Android TV. Requests for TV versions of Morphe features are welcome; features for phone apps belong in upstream [NexAlloy](https://github.com/NexAlloy/NexAlloy).
